name: Evergreen organization rollup

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: ["Evergreen organization scan"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evergreen-pages
  cancel-in-progress: false

jobs:
  rollup:
    name: Build and publish rollup report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download scan report artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: reports

      - name: Generate static rollup report
        run: |
          mkdir -p _site
          owners_arg=""
          if [ -f "owners.json" ]; then
            owners_arg="--owners owners.json"
          fi
          report_files=$(find reports -name "*.json" | sort)
          if [ -z "$report_files" ]; then
            echo "No scan report artifacts found in reports/." >&2
            exit 1
          fi
          npx --yes evergreen-deprecation rollup $report_files $owners_arg --html > _site/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
